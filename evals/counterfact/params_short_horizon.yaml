# Table 1: CounterFACT mixed documents, sequence length 10, full system list.
run_name: "memoryllm"
seed: 42 # for seq 4

distributed:
  cuda_visible_devices: "0,1,2,3"
  nproc_per_node: 4
  master_port: 29512

log:
  wandb_project: "gnm_draft_experiments"
  batch_log_interval: 1

sampling:
  num_paraphrase_from_facts_to_learn: 1
  num_true_output_neighbor_from_facts_to_learn: 1
  num_paraphrase_from_facts_to_refuse: 2
  num_true_output_neighbor_from_facts_to_refuse: 1
  num_paraphrase_from_other_facts: 1
  num_true_output_neighbor_from_other_facts: 0
  max_total_io_pairs_per_sample: 4
  num_io_pairs_to_chunk: 2
  max_new_tokens: 8

loop:
  completions_batch_sample_count: 1
  sequence_length: 10
  unlearning: false
  probe_first_only: false

data:
  val_ood_datasets:
    - "../../data/counterfact/test_unseen_categories_0.json"
    - "../../data/counterfact/test_unseen_categories_1.json"
    - "../../data/counterfact/test_unseen_categories_2.json"
  val_limit: null
  eligible_target_types_val_ood:
    - "fact_subcategories"
    - "formats"
    - "refusal_subcategories"
  holdout_targets_val_ood:
    - "json"
    - "yaml"
    - "csv"
    - "toml"
    - "us_cities_or_states"
    - "non_us_cities_or_states"
    - "country"
    - "major_western_european_languages"
    - "eastern_european_mediterranean_languages"
    - "asian_middle_eastern_languages_and_pacific"
    - "tech_industrial_or_gaming_company"
    - "TV_entertainment_or_news_organization"
    - "car_company"
    - "music_or_art_related_occupation"
    - "sports_related_occupation"
    - "politics_entertainment_religion_related_occupation"
    - "us_cities_or_states_refusal"
    - "non_us_cities_or_states_refusal"
    - "country_refusal"
    - "major_western_european_languages_refusal"
    - "eastern_european_mediterranean_languages_refusal"
    - "asian_middle_eastern_languages_and_pacific_refusal"
    - "tech_industrial_or_gaming_company_refusal"
    - "TV_entertainment_or_news_organization_refusal"
    - "car_company_refusal"
    - "music_or_art_related_occupation_refusal"
    - "sports_related_occupation_refusal"
    - "politics_entertainment_religion_related_occupation_refusal"
  holdout_target_values_val_ood: null 

# The full Table-1 (CounterFACT mixed-documents, sequence length 10) system list.
# Comment out entries to evaluate a subset.
evals:
  - model: memoryllm_chat
    run_key: gnm
    pretty_name: "GNM"
    model_state_dict_path: "../../models/gnm_counterfact/model.pth"
  - model: memoryllm_chat
    run_key: gnm_ablation
    pretty_name: "GNM (ablation)"
    model_state_dict_path: "../../models/gnm_counterfact_ablation/model.pth"
  - model: memoryllm_chat
    run_key: memoryllm
    pretty_name: "MemoryLLM"
    model_state_dict_path: null
  - model: llama3_8b_instruct
    run_key: llama3_ft
    pretty_name: "ICL-FT"
    model_state_dict_path: "../../models/icl_ft_counterfact/model.pth"
  - model: llama3_8b_instruct
    run_key: llama3
    pretty_name: "ICL"
    model_state_dict_path: null
  - model: llama3_8b_instruct_rag
    run_key: rag_trained
    pretty_name: "RAG-FT"
    model_state_dict_path: "../../models/rag_ft_counterfact/model.pth"
  - model: llama3_8b_instruct_rag
    run_key: rag_untrained
    pretty_name: "RAG"
    model_state_dict_path: null
  - model: llama3_8b_instruct_hipporag
    run_key: llama3_8b_hipporag
    pretty_name: "HippoRAG"
    model_state_dict_path: null
  - model: qwen3_14b_instruct
    run_key: qwen14b_icl_untrained
    pretty_name: "Qwen3-14B ICL"
    model_state_dict_path: null
  - model: qwen3_14b_instruct_rag
    run_key: qwen14b_rag_untrained
    pretty_name: "Qwen3-14B RAG"
    model_state_dict_path: null
  - model: gemma3_12b_instruct
    run_key: gemma3_12b_icl
    pretty_name: "Gemma3-12B ICL"
    model_state_dict_path: null
  - model: gemma3_12b_instruct_rag
    run_key: gemma3_12b_rag
    pretty_name: "Gemma3-12B RAG"
    model_state_dict_path: null
  - model: memoryllm_chat_no_memory
    run_key: naive_model
    pretty_name: "Naive Model"
    model_state_dict_path: null